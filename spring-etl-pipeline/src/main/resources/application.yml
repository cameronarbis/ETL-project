spring:
  application:
    name: etl-pipeline

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: etl-pipeline-group
      auto-offset-reset: earliest
      max-poll-records: 100
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: "transaction:com.dataplatform.etl.model.Transaction"

  datasource:
    url: jdbc:postgresql://localhost:5432/transactions_db
    username: datauser
    password: datapass123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

server:
  port: 8082

kafka:
  topic:
    transactions: transactions
    transactions-dlq: transactions-dlq
  retry:
    max-attempts: 3
    initial-backoff-ms: 1000
    backoff-multiplier: 2
  dlq:
    enabled: true
    topic: transactions-dlq

database:
  table:
    transactions: transactions
